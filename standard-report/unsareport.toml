[project]
config_version = 1

[package]
name = "@unsareport/standard-report"
version = "0.2.0"
displayName = "UNSA Standard Report Template & Layout"
description = "Plantilla estándar de informes académicos UNSA con portada institucional, sangría jerárquica contextual y renombrado automático post-build"
tags = ["unsa", "report", "template", "standard"]
command_prefix = "standard-report"

[dependencies]
"@unsareport/autoindent" = "^0.2.0"
"@unsareport/define" = "^0.2.0"
"@unsareport/standard-report-theming" = "^0.2.0"

[root-files]
files = ["tsconfig.unsareport.json"]

[components]
files = ["lib.typ", "README.md", "scripts/**/*", "img/**/*", "tsconfig.unsareport.json"]

[templates]
files = ["template/**/*"]

[commands.copy-report]
description = "Copy compiled report to a formatted filename based on exported metadata (reads UNSAREP_CONFIG_STANDARD_REPORT_FILENAME_FORMAT)"
commands = { any = ["bun run --tsconfig-override tsconfig.unsareport.json components/@unsareport/standard-report/scripts/copy_report.ts"] }

[hooks.build]
after = ["copy-report"]

[config-schema.filename_format]
type = "string"
required = true
default = "{course} - {activity_code} - {group} - Informe.pdf"
doc = "Format string for renaming compiled report. Tokens: {course}, {activity_code}, {group}, {pretitle}, {title}, {teacher}, {authors}, {year}, {faculty}, {school}, {university}, {city_country}. Passed to the copy-report hook as UNSAREP_CONFIG_STANDARD_REPORT_FILENAME_FORMAT."

