[project]
config_version = 1

[package]
name = "@unsareport/ne-lab-2026"
version = "0.2.2"
displayName = "NE Lab 2026 Report Template & Layout"
description = "Plantilla e infraestructura de informes de Negocios Electrónicos (UNSA) con sangría jerárquica y renombrado automático post-build"
tags = ["unsa", "ne", "negocios-electronicos", "report", "template"]
command_prefix = "ne-lab-2026"

[dependencies]
"@unsareport/autoindent" = "^0.2.0"
"@unsareport/define" = "^0.2.0"

[root-files]
files = ["tsconfig.unsareport.json"]

[components]
files = ["lib.typ", "README.md", "scripts/**/*", "img/**/*", "tsconfig.unsareport.json"]

[templates]
files = ["template/**/*"]

[commands.compress-pdf]
description = "Compress compiled report PDF using Ghostscript (reads UNSAREP_CONFIG_NE_LAB_2026_PDF_SETTINGS)"
commands = { any = ["bun run --tsconfig-override tsconfig.unsareport.json components/@unsareport/ne-lab-2026/scripts/compress_pdf.ts"] }

[commands.copy-report]
description = "Copy compiled report to a formatted filename based on exported metadata (reads UNSAREP_CONFIG_NE_LAB_2026_FILENAME_FORMAT)"
commands = { any = ["bun run --tsconfig-override tsconfig.unsareport.json components/@unsareport/ne-lab-2026/scripts/copy_report.ts"] }

[hooks.build]
after = ["compress-pdf", "copy-report"]

[config-schema.filename_format]
type = "string"
required = true
default = "NE Grupo {group} Subgrupo {subgroup} - Sesión {session-number} {deliverable-number} - Inv For {year} {semester} {delivery-type} - Informe Entregable e Informe Investigación Formativa - {topic} - {stage} - {authors-short}.pdf"
doc = "Format string for renaming compiled report. Tokens: {group}, {subgroup}, {session-number}, {deliverable-number}, {year}, {semester}, {delivery-type}, {topic}, {stage}, {authors-short}, {course}, etc. Passed to the copy-report hook as UNSAREP_CONFIG_NE_LAB_2026_FILENAME_FORMAT."

[config-schema.pdf_settings]
type = "string"
required = true
default = "/ebook"
doc = "Ghostscript PDFSETTINGS quality preset for PDF compression: /screen (72 dpi, smallest), /ebook (150 dpi, recommended default), /printer (300 dpi), /prepress (300 dpi, high quality color), or /default. Passed to the compress-pdf hook as UNSAREP_CONFIG_NE_LAB_2026_PDF_SETTINGS."
